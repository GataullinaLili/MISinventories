<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Пользователи — АРМ.Вещи</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; }
        .modal-overlay.active { display: flex; }
        .modal { background: white; border-radius: 12px; padding: 30px; width: 90%; max-width: 450px; }
        .modal h3 { margin-top: 0; }
        .green { color: green; font-weight: bold; }
        .red { color: red; font-weight: bold; }
    </style>
</head>
<body>
<div th:replace="~{fragments/sidebar :: sidebar}"></div>
<div class="main-content">
    <div th:replace="~{fragments/topbar :: topbar}"></div>
    <div class="content">

        <div th:if="${success}" style="background:#e8f5e9;padding:15px;border-radius:8px;margin-bottom:20px;color:#2e7d32;" th:text="${success}"></div>
        <div th:if="${error}" style="background:#fce4ec;padding:15px;border-radius:8px;margin-bottom:20px;color:#c62828;" th:text="${error}"></div>

        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
            <h1 class="page-title" style="margin:0;">👥 Пользователи</h1>
            <button onclick="openModal('add-user-modal')" class="btn btn-primary">+ Добавить</button>
        </div>

        <div class="card">
            <div class="table-container">
                <table>
                    <thead>
                    <tr><th>Логин</th><th>ФИО</th><th>Роль</th><th>Статус</th><th>Действия</th></tr>
                    </thead>
                    <tbody>
                    <tr th:each="u : ${users}">
                        <td><strong th:text="${u.login}">—</strong></td>
                        <td th:text="${u.fullName}">—</td>
                        <td th:text="${u.role.displayName}">—</td>
                        <td>
                            <span th:if="${u.active}" class="green">Активен</span>
                            <span th:unless="${u.active}" class="red">Заблокирован</span>
                        </td>
                        <td>
                            <button class="btn btn-outline btn-sm edit-btn"
                                    th:attr="data-id=${u.id},data-login=${u.login},data-fullname=${u.fullName}">✏</button>
                            <form th:action="@{'/admin/users/'+${u.id}+'/toggle'}" method="post" style="display:inline;">
                                <button type="submit" class="btn btn-outline btn-sm" th:text="${u.active} ? '🔒' : '🔓'"></button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- Модальное окно: Добавить -->
<div id="add-user-modal" class="modal-overlay">
    <div class="modal">
        <h3>Добавить пользователя</h3>
        <form th:action="@{/admin/users/create}" method="post">
            <div class="form-group"><label>Логин *</label><input type="text" name="login" class="form-control" required></div>
            <div class="form-group"><label>Пароль *</label><input type="password" name="password" class="form-control" required minlength="6"></div>
            <div class="form-group"><label>ФИО *</label><input type="text" name="fullName" class="form-control" required></div>
            <div class="form-group">
                <label>Роль *</label>
                <select name="role" class="form-control" required>
                    <option value="">Выберите</option>
                    <option value="ADMIN">Администратор</option>
                    <option value="STOREKEEPER">Сотрудник склада</option>
                    <option value="RECEPTIONIST">Приёмщик</option>
                    <option value="ANALYST">Аналитик</option>
                </select>
            </div>
            <div style="display:flex;gap:10px;justify-content:flex-end;">
                <button type="button" class="btn btn-outline" onclick="closeModal('add-user-modal')">Отмена</button>
                <button type="submit" class="btn btn-success">Сохранить</button>
            </div>
        </form>
    </div>
</div>

<!-- Модальное окно: Редактировать -->
<div id="edit-user-modal" class="modal-overlay">
    <div class="modal">
        <h3>Редактировать</h3>
        <form id="edit-form" method="post">
            <div class="form-group"><label>Логин</label><input type="text" id="edit-login" name="newLogin" class="form-control"></div>
            <div class="form-group"><label>ФИО *</label><input type="text" id="edit-fullname" name="fullName" class="form-control" required></div>
            <div class="form-group"><label>Новый пароль</label><input type="password" name="password" class="form-control"></div>
            <div class="form-group"><label>Подтверждение</label><input type="password" name="passwordConfirm" class="form-control"></div>
            <div style="display:flex;gap:10px;justify-content:flex-end;">
                <button type="button" class="btn btn-outline" onclick="closeModal('edit-user-modal')">Отмена</button>
                <button type="submit" class="btn btn-primary">Сохранить</button>
            </div>
        </form>
    </div>
</div>

<script th:src="@{/js/app.js}"></script>
<script>
    document.addEventListener('click', function(e) {
        if (e.target.classList.contains('edit-btn')) {
            var id = e.target.getAttribute('data-id');
            var login = e.target.getAttribute('data-login');
            var fullName = e.target.getAttribute('data-fullname');
            document.getElementById('edit-form').action = '/admin/users/' + id + '/update';
            document.getElementById('edit-login').value = login;
            document.getElementById('edit-fullname').value = fullName;
            document.querySelectorAll('#edit-form input[type=password]').forEach(function(el) { el.value = ''; });
            openModal('edit-user-modal');
        }
    });
</script>
</body>
</html>
