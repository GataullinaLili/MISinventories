<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ячейки — АРМ.Вещи</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/sidebar :: sidebar}"></div>
<div class="main-content">
    <div th:replace="~{fragments/topbar :: topbar}"></div>
    <div class="content">
        <div th:if="${success}" style="background:#e8f5e9;padding:12px;border-radius:8px;margin-bottom:15px;" th:text="${success}"></div>
        <div th:if="${error}" style="background:#fce4ec;padding:12px;border-radius:8px;margin-bottom:15px;" th:text="${error}"></div>

        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;">
            <h1 class="page-title" style="margin:0;">📦 Ячейки</h1>
            <button onclick="openModal('add-cell-modal')" class="btn btn-primary">+ Добавить ячейку</button>
        </div>

        <div class="card" th:if="${cells != null && !cells.isEmpty()}">
            <table>
                <thead><tr><th>ID</th><th>Название</th><th>Склад</th><th>Статус</th><th>Действия</th></tr></thead>
                <tbody>
                <tr th:each="c : ${cells}">
                    <td th:text="${c.id}">1</td>
                    <td><strong th:text="${c.name}">—</strong></td>
                    <td th:text="${c.storage.name}">—</td>
                    <td>
                        <span th:if="${c.isOccupied}" style="color:red;">Занята</span>
                        <span th:unless="${c.isOccupied}" style="color:green;">Свободна</span>
                    </td>
                    <td>
                        <form th:action="@{'/admin/cells/'+${c.id}+'/delete'}" method="post" style="display:inline;" onsubmit="return confirm('Удалить ячейку?');">
                            <button type="submit" class="btn btn-danger btn-sm" th:disabled="${c.isOccupied}">🗑</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div id="add-cell-modal" class="modal-overlay">
    <div class="modal">
        <h3>Добавить ячейку</h3>
        <form th:action="@{/admin/cells/create}" method="post">
            <div class="form-group"><label>Название</label><input type="text" name="name" class="form-control" required></div>
            <div class="form-group"><label>Склад</label><select name="storageId" class="form-control" required><option value="">—</option><option th:each="s : ${storages}" th:value="${s.id}" th:text="${s.name}">—</option></select></div>
            <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:15px;">
                <button type="button" class="btn btn-outline" onclick="closeModal('add-cell-modal')">Отмена</button>
                <button type="submit" class="btn btn-primary">Сохранить</button>
            </div>
        </form>
    </div>
</div>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
