<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Склады — АРМ.Вещи</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; }
        .modal-overlay.active { display: flex; }
        .modal { background: white; border-radius: 12px; padding: 25px; width: 90%; max-width: 450px; }
    </style>
</head>
<body>
<div th:replace="~{fragments/sidebar :: sidebar}"></div>
<div class="main-content">
    <div th:replace="~{fragments/topbar :: topbar}"></div>
    <div class="content">
        <div th:if="${success}" style="background:#e8f5e9;padding:12px;border-radius:8px;margin-bottom:15px;" th:text="${success}"></div>
        <div th:if="${error}" style="background:#fce4ec;padding:12px;border-radius:8px;margin-bottom:15px;" th:text="${error}"></div>

        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;">
            <h1 class="page-title" style="margin:0;">🏠 Склады</h1>
            <button onclick="openModal('add-storage-modal')" class="btn btn-primary">+ Добавить склад</button>
        </div>

        <div class="card" th:if="${storages != null && !storages.isEmpty()}">
            <table>
                <thead><tr><th>ID</th><th>Наименование</th><th>Тип</th><th>Ячеек</th><th>Свободно</th><th>Действия</th></tr></thead>
                <tbody>
                <tr th:each="s : ${storages}">
                    <td th:text="${s.id}">1</td>
                    <td><strong th:text="${s.name}">—</strong></td>
                    <td th:text="${s.storageType.displayName}">—</td>
                    <td th:text="${s.cells != null ? #lists.size(s.cells) : 0}">0</td>
                    <td th:text="${s.cells != null ? s.cells.?[!isOccupied].size() : 0}">0</td>
                    <td>
                        <button class="btn btn-outline btn-sm" th:attr="onclick=|openRenameModal(${s.id},'${s.name}')|">✏</button>
                        <a th:href="@{'/admin/cells?storageId='+${s.id}}" class="btn btn-outline btn-sm">📦</a>
                        <form th:action="@{'/admin/storages/'+${s.id}+'/delete'}" method="post" style="display:inline;" onsubmit="return confirm('Удалить склад?');">
                            <button type="submit" class="btn btn-danger btn-sm">🗑</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div id="add-storage-modal" class="modal-overlay">
    <div class="modal">
        <h3>Добавить склад</h3>
        <form th:action="@{/admin/storages/create}" method="post">
            <div class="form-group"><label>Название</label><input type="text" name="name" class="form-control" required></div>
            <div class="form-group"><label>Тип</label><select name="storageType" class="form-control" required><option value="">—</option><option value="RECEPTION">Приёмное отделение</option><option value="LONG_TERM">Долговременный</option></select></div>
            <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:15px;">
                <button type="button" class="btn btn-outline" onclick="closeModal('add-storage-modal')">Отмена</button>
                <button type="submit" class="btn btn-primary">Сохранить</button>
            </div>
        </form>
    </div>
</div>

<div id="rename-storage-modal" class="modal-overlay">
    <div class="modal">
        <h3>Переименовать склад</h3>
        <form id="rename-storage-form" method="post">
            <div class="form-group"><label>Новое название</label><input type="text" id="rename-storage-name" name="name" class="form-control" required></div>
            <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:15px;">
                <button type="button" class="btn btn-outline" onclick="closeModal('rename-storage-modal')">Отмена</button>
                <button type="submit" class="btn btn-primary">Сохранить</button>
            </div>
        </form>
    </div>
</div>

<script th:src="@{/js/app.js}"></script>
<script>
    function openRenameModal(id, name) {
        document.getElementById('rename-storage-form').action = '/admin/storages/' + id + '/rename';
        document.getElementById('rename-storage-name').value = name;
        openModal('rename-storage-modal');
    }
</script>
</body>
</html>
