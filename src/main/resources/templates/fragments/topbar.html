<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
</head>
<body>
<div th:fragment="topbar" class="topbar">
    <div class="topbar-left">
        <h3>АРМ.Вещи</h3>
    </div>
    <div class="topbar-right">
        <div class="user-info">
            <span class="user-avatar" sec:authentication="name"
                  th:text="${#strings.substring(#authentication.name, 0, 1)}"></span>
            <div style="line-height:1.3;">
                <div style="font-weight:600;font-size:14px;color:#1a3a4a;" sec:authentication="name"></div>
                <div style="font-size:12px;color:#287aa3;">
                    <span sec:authorize="hasRole('ADMIN')">Администратор</span>
                    <span sec:authorize="hasRole('STOREKEEPER')">Сотрудник склада</span>
                    <span sec:authorize="hasRole('RECEPTIONIST')">Приёмщик</span>
                    <span sec:authorize="hasRole('ANALYST')">Аналитик</span>
                </div>
            </div>
        </div>
        <form th:action="@{/exit}" method="post" style="margin:0;">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <button type="submit" class="btn btn-outline btn-sm">Выход</button>
        </form>
    </div>
</div>
</body>
</html>
