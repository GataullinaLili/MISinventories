<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Справочник ячеек — АРМ.Вещи</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .cell-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
        }
        .cell-card {
            background: white;
            border-radius: 10px;
            padding: 15px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.06);
            text-align: center;
            border: 2px solid #e9ecef;
            transition: all 0.2s;
        }
        .cell-card.occupied {
            border-color: #e74c3c;
            background: #fff5f5;
        }
        .cell-card.free {
            border-color: #2ecc71;
            background: #f0fff4;
        }
        .cell-name {
            font-size: 18px;
            font-weight: 700;
            color: #1a3a4a;
            margin-bottom: 8px;
        }
        .cell-storage {
            font-size: 13px;
            color: #888;
            margin-bottom: 8px;
        }
        .cell-status {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }
        .status-occupied {
            background: #fce4ec;
            color: #c62828;
        }
        .status-free {
            background: #e8f5e9;
            color: #2e7d32;
        }
    </style>
</head>
<body>
<div th:replace="~{fragments/sidebar :: sidebar}"></div>
<div class="main-content">
    <div th:replace="~{fragments/topbar :: topbar}"></div>
    <div class="content">
        <h1 class="page-title">📦 Справочник ячеек</h1>
        <p style="color:#888;margin-bottom:20px;">Просмотр занятости ячеек. Только для чтения.</p>

        <div class="cell-grid" th:if="${cells != null && !cells.isEmpty()}">
            <div th:each="cell : ${cells}"
                 class="cell-card"
                 th:classappend="${cell.isOccupied} ? 'occupied' : 'free'">
                <div class="cell-name" th:text="${cell.name}">А-01</div>
                <div class="cell-storage" th:text="${cell.storage.name}">Склад</div>
                <div>
                    <span th:if="${cell.isOccupied}" class="cell-status status-occupied">Занята</span>
                    <span th:unless="${cell.isOccupied}" class="cell-status status-free">Свободна</span>
                </div>
            </div>
        </div>

        <div th:unless="${cells != null && !cells.isEmpty()}" style="text-align:center;padding:40px;color:#888;">
            <p style="font-size:48px;">📦</p>
            <p>Нет ячеек</p>
        </div>
    </div>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
