<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ошибка — АРМ.Вещи</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a3a4a 0%, #287aa3 50%, #1a3a4a 100%);
            margin: 0;
        }
        .error-container {
            background: white;
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            max-width: 500px;
        }
        .error-code { font-size: 72px; font-weight: 700; color: #c62828; }
        .error-message { font-size: 18px; color: #555; margin: 20px 0; }
        .btn-home { background: #287aa3; color: white; padding: 10px 20px; border-radius: 8px; text-decoration: none; }
    </style>
</head>
<body>
<div class="error-container">
    <div class="error-code" th:text="${status}">500</div>
    <div class="error-message" th:text="${error}">Внутренняя ошибка сервера</div>
    <p th:text="${message}"></p>
    <a href="/search" class="btn-home">Вернуться на главную</a>
</div>
</body>
</html>
