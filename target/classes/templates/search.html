<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Поиск — АРМ.Вещи</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<div class="main-content">
    <div th:replace="~{fragments/topbar :: topbar}"></div>

    <div class="content">
        <h1 class="page-title">🔍 Поиск пациентов</h1>

        <div class="card">
            <form onsubmit="event.preventDefault(); searchPatients();" style="margin-bottom: 20px;">
                <div class="search-box" style="display: flex; gap: 10px;">
                    <input type="text" id="search-query"
                           class="form-control"
                           placeholder="Введите ФИО, номер истории болезни или ФИО + дата рождения..."
                           style="flex: 1;">
                    <button type="submit" class="btn btn-primary">🔍 Найти</button>
                </div>
            </form>
            <div id="search-results">
                <div style="text-align:center; padding:30px; color:#888;">
                    <p>🔍 Введите поисковый запрос и нажмите «Найти»</p>
                    <p style="font-size:13px;">Например: Иванов, ИБ-10001 или Иванов 01.01.1980</p>
                </div>
            </div>
        </div>
    </div>
</div>

<script th:src="@{/js/app.js}"></script>
<script>
    function searchPatients() {
        const query = document.getElementById('search-query').value.trim();
        if (!query) {
            alert('Введите поисковый запрос');
            return;
        }

        const resultsDiv = document.getElementById('search-results');
        resultsDiv.innerHTML = '<div style="text-align:center; padding:30px; color:#888;"><p>⏳ Поиск...</p></div>';

        fetch('/search/api?query=' + encodeURIComponent(query))
            .then(res => {
                if (!res.ok) throw new Error('Ошибка сервера');
                return res.json();
            })
            .then(data => {
                if (!data || data.length === 0) {
                    resultsDiv.innerHTML = `
                        <div style="text-align:center; padding:30px; color:#888;">
                            <p>🔍 По запросу «${query}» ничего не найдено</p>
                            <p style="font-size:13px;">Попробуйте изменить запрос или проверьте номер истории болезни</p>
                        </div>`;
                    return;
                }

                let html = '<div class="table-container"><table><thead><tr>' +
                    '<th>ФИО</th><th>Номер истории</th><th>Дата рождения</th><th>Действия</th>' +
                    '</tr></thead><tbody>';

                data.forEach(patient => {
                    html += `<tr>
                        <td><strong>${patient.fullName || '—'}</strong></td>
                        <td>${patient.medicalCardNumber || '—'}</td>
                        <td>${patient.birthDate || '—'}</td>
                        <td>
                            <a href="/receptionist/create?medicalCardNumber=${encodeURIComponent(patient.medicalCardNumber || '')}"
                               class="btn btn-primary btn-sm">
                                📋 Создать опись
                            </a>
                        </td>
                    </tr>`;
                });

                html += '</tbody></table></div>';
                resultsDiv.innerHTML = html;
            })
            .catch(err => {
                console.error('Ошибка поиска:', err);
                resultsDiv.innerHTML = `
                    <div style="text-align:center; padding:30px; color:#c62828;">
                        <p>❌ Ошибка при поиске</p>
                        <p style="font-size:13px;">Попробуйте позже или обратитесь к администратору</p>
                    </div>`;
            });
    }

    document.getElementById('search-query').focus();
</script>
</body>
</html>
